name: On License Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - LICENSE.md

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo with the base license (this one!)
        uses: actions/checkout@v5

      - name: Create installation token for the Github app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get user ID for the Github app, for use in PR author info like emails and stuff
        id: bot-user
        uses: actions/github-script@v9
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          result-encoding: string
          script: |
            const username = `${process.env.APP_SLUG}[bot]`
            const { data } = await github.rest.users.getByUsername({ username })
            return String(data.id)

      - name: Find all repositories under RDG
        id: target-repos
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const org = context.repo.owner
            const sourceRepo = context.repo.repo

            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org,
              type: 'all',
              per_page: 100,
            })

            return repos
              .filter(repo =>
                !repo.archived &&
                !repo.fork &&
                !repo.disabled &&
                repo.name !== sourceRepo
              )
              .map(repo => `${org}/${repo.name}`)
              .sort()




      - name: Find all repositories under the organization
        id: target-repos
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          result-encoding: string
          script: |
            const org = context.repo.owner
            const sourceRepo = context.repo.repo

            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org,
              type: 'all',
              per_page: 100,
            })

            const targets = repos
              .filter(repo =>
                !repo.archived &&
                !repo.fork &&
                !repo.disabled &&
                repo.name !== sourceRepo
              )
              .map(repo => ({
                owner: org,
                name: repo.name,
                full_name: repo.full_name,
                default_branch: repo.default_branch,
              }))
              .sort((a, b) => a.name.localeCompare(b.name))

            return JSON.stringify(targets)


      - name: Run the license syncing script
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ github.event.repository.name }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET_REPOS_JSON: ${{ steps.target-repos.outputs.result }}
          GIT_USERNAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_EMAIL: ${{ steps.bot-user.outputs.result }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: node .github/scripts/sync-license.mjs