name: On License Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - LICENSE.md

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo with the base license (this one!)
        uses: actions/checkout@v4

      - name: Create installation token for the Github app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get user ID for the Github app, for use in PR author info like emails and stuff
        id: bot-user
        uses: actions/github-script@v7
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          result-encoding: string
          script: |
            const username = `${process.env.APP_SLUG}[bot]`;
            const { data } = await github.rest.users.getByUsername({ username });
            return String(data.id);

      - name: Find all repositories under RDG and include them in a filesync config file
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');

            const org = context.repo.owner;
            const sourceRepo = context.repo.repo;

            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org,
              type: 'all',
              per_page: 100,
            });

            const targets = repos
              .filter(repo =>
                !repo.archived &&
                !repo.fork &&
                !repo.disabled &&
                repo.name !== sourceRepo
              )
              .map(repo => `${org}/${repo.name}`)
              .sort();

            const outputFile = [
              '# An automatically generated config file for Repo File Sync Action.',
              '# No file changes here will have any effect.',
              '# Visit `.github/workflows/on-license-push.yml` for more info!',
              'group:',
              '  repos: |',
              ...targets.map(repo => `    ${repo}`),
              '  files:',
              '    - source: LICENSE.md',
              '      dest: LICENSE.md',
              '',
            ].join('\n');

            fs.mkdirSync('.github', { recursive: true });
            fs.writeFileSync('.github/sync_cache.yml', outputFile);

      - name: Send sync action using `sync_cache.yml` to target repos
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_USERNAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_EMAIL: ${{ steps.bot-user.outputs.result }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          CONFIG_PATH: .github/sync_cache.yml
